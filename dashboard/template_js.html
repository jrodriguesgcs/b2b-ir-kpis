<script>
const D = __DATA__;

/* ────────── constants ────────── */
/* Display order for the 5 per-stage ranked boxes. */
const BOX_ORDER = ['retained_clients', 'referred_clients', 'new_intermediaries', 'presentations', 'calls_meetings'];
const STAGE_COLOR_BY_KEY = {
  retained_clients: '#000957', referred_clients: '#3F8CFF', presentations: '#667085',
  calls_meetings: '#9DBEFA', new_intermediaries: '#C7CCD4',
};
const OWNER_ORDER = D.owner_order;
const OWNER_COLOR = {[OWNER_ORDER[0]]: '#000957', [OWNER_ORDER[1]]: '#3F8CFF'};
const OWNER_NAME = D.owners;
const YEAR = D.meta.year;
const THROUGH = D.meta.through;
const CURRENT_MONTH = +THROUGH.slice(5, 7);
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ────────── state ────────── */
function initialPeriodFromUrl() {
  const p = new URLSearchParams(window.location.search).get('period');
  if (p === 'ytd') return 'ytd';
  if (p && /^m-(0[1-9]|1[0-2])$/.test(p) && +p.slice(2) <= CURRENT_MONTH) return p;
  return 'ytd';
}
function initialDirectorFromUrl() {
  const d = new URLSearchParams(window.location.search).get('director');
  return d && OWNER_ORDER.includes(d) ? d : null; // null = All Directors
}
const S = { period: initialPeriodFromUrl(), director: initialDirectorFromUrl() };
let lastFocusedEl = null;
/* The Director(s) currently in scope - just the selected one when the
   Director filter is active, both (in display order) when it's "All". */
function activeOwners() {
  return S.director ? [S.director] : OWNER_ORDER;
}

/* ────────── data access ────────── */
const fmt = n => (n == null ? '—' : n.toLocaleString('en-US'));
const pct = (n, d) => (d ? Math.round((100 * n) / d) : 0);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function monthPrefix(m) { return `${YEAR}-${String(m).padStart(2, '0')}-`; }
function periodMatch(day) {
  return S.period === 'ytd' ? true : day.startsWith(monthPrefix(+S.period.slice(2)));
}
/* Sum a stage's daily counts for one owner (or the active Director(s), if
   ownerId is null) over the current period. */
function stageSum(stageKey, ownerId) {
  const daily = D.stages[stageKey].daily;
  const ids = ownerId ? [ownerId] : activeOwners();
  let t = 0;
  for (const id of ids) {
    const days = daily[id] || {};
    for (const [day, v] of Object.entries(days)) if (periodMatch(day)) t += v;
  }
  return t;
}
/* Sum a stage for a specific month, for one owner or the active Director(s)
   (ownerId null) - regardless of S.period. */
function stageMonthTotal(stageKey, month, ownerId) {
  const daily = D.stages[stageKey].daily;
  const prefix = monthPrefix(month);
  const ids = ownerId ? [ownerId] : activeOwners();
  let t = 0;
  for (const id of ids) {
    const days = daily[id] || {};
    for (const [day, v] of Object.entries(days)) if (day.startsWith(prefix)) t += v;
  }
  return t;
}
/* Sum a stage's daily counts from Jan 1 through the end of the selected
   period (today, if YTD; the last day of the selected month, otherwise) -
   the cumulative-progress-to-date basis for the Target columns and the
   table's Total column. Distinct from stageSum(), which for a selected
   month returns only that single month's isolated count. */
function cumulativeThroughPeriod(stageKey, ownerId) {
  if (S.period === 'ytd') return stageSum(stageKey, ownerId);
  const month = +S.period.slice(2);
  const cutoff = `${YEAR}-${String(month).padStart(2, '0')}-31`; // lexicographic ISO cutoff
  const daily = D.stages[stageKey].daily;
  const ids = ownerId ? [ownerId] : activeOwners();
  let t = 0;
  for (const id of ids) {
    const days = daily[id] || {};
    for (const [day, v] of Object.entries(days)) if (day <= cutoff) t += v;
  }
  return t;
}

/* ────────── click-through-to-HubSpot (Retained -> deal, Referred -> contact,
   Presentations/Calls/Meetings/New Intermediaries -> company + contact) ─── */
function recordsFor(stageKey, ownerId, program) {
  if (stageKey === 'retained_clients') {
    const deals = D.stages.retained_clients.deals || [];
    return { kind: 'deal', records: deals.filter(d => periodMatch(d.day) && (!ownerId || d.owner === ownerId) && (!program || d.program === program)) };
  }
  if (stageKey === 'referred_clients') {
    const contacts = D.stages.referred_clients.contacts || [];
    return { kind: 'contact', records: contacts.filter(c => periodMatch(c.day) && (!ownerId || c.owner === ownerId)) };
  }
  if (stageKey === 'presentations' || stageKey === 'calls_meetings' || stageKey === 'new_intermediaries') {
    const records = D.stages[stageKey].records || [];
    return { kind: 'companyContact', records: records.filter(r => periodMatch(r.day) && (!ownerId || r.owner === ownerId)) };
  }
  return { kind: null, records: [] };
}
/* A clickable cell for Retained/Referred - a real <button> when nonzero
   (opens the underlying record(s) in HubSpot), plain text otherwise.
   aria-label carries the context a bare number can't (stage + BDM),
   since the visible text is just the count. */
function clickableCell(stageKey, value, ownerId) {
  if (!value) return fmt(0);
  const who = ownerId ? `, ${OWNER_NAME[ownerId]}` : '';
  const label = `${fmt(value)} ${D.stages[stageKey].label}${who} - open in HubSpot`;
  return `<button class="num-link" type="button" data-stage="${stageKey}" data-owner="${ownerId || ''}" aria-label="${escapeHtml(label)}">${fmt(value)}</button>`;
}
/* Always opens a modal first - never redirects straight to HubSpot, even
   when there's exactly one underlying record. The modal's own links are
   the only way to actually leave the page. */
function onNumLinkClick(btn) {
  const stageKey = btn.dataset.stage;
  const owner = btn.dataset.owner || null;
  const { kind, records } = recordsFor(stageKey, owner, null);
  if (!records.length) return;
  const parts = [D.stages[stageKey].label];
  if (owner) parts.push(OWNER_NAME[owner]);
  const title = parts.join(' · ');
  if (kind === 'deal') { openRecordModal(records, D.meta.deal_url_base, title); return; }
  if (kind === 'contact') { openReferredModal(records, title); return; }
  if (kind === 'companyContact') { openCompanyContactModal(records, title); return; }
}
/* Shared modal-open plumbing (show, set focus, attach the focus-trap/
   Escape listener) - used by every record-list modal (openRecordModal,
   openReferredModal, openCompanyContactModal), which differ only in the
   list markup they build. */
function showModal(title, subtitle, listHtml) {
  document.getElementById('dealModalTitle').textContent = title;
  document.getElementById('dealModalSub').textContent = subtitle;
  document.getElementById('dealModalList').innerHTML = listHtml;
  lastFocusedEl = document.activeElement;
  document.getElementById('dealModalBackdrop').hidden = false;
  // Focus the title, not the Close button at the bottom of the list -
  // Close is the last element in the scrollable .modal container, and
  // focusing it scrolls the container to the bottom by default. The
  // title is also the conventional initial-focus target for a dialog
  // with no more specific default action, and reads its name first.
  document.getElementById('dealModalTitle').focus();
  document.addEventListener('keydown', onModalKeydown);
}
function openRecordModal(records, urlBase, title) {
  const itemHtml = r => `<li><a href="${urlBase}${r.id}" target="_blank" rel="noopener">${escapeHtml(r.name)}${r.program ? ' · ' + escapeHtml(r.program) : ''}</a></li>`;
  const subtitle = `${records.length} record${records.length === 1 ? '' : 's'} - click one to open it in HubSpot`;
  showModal(title, subtitle, records.map(itemHtml).join(''));
}
/* Referred Clients modal - the client's own name stays the sole link (the
   HubSpot record actually being counted); program of interest and the
   introducer's company render as plain descriptive text underneath, since
   neither is itself a navigable HubSpot record here (introducer_company
   carries no id in the data). */
function openReferredModal(records, title) {
  const itemHtml = r => {
    const meta = [r.program, r.introducer_company].filter(Boolean).map(escapeHtml).join(' · ');
    return `<li class="modal-row">
      <a href="${D.meta.contact_url_base}${r.id}" target="_blank" rel="noopener">${escapeHtml(r.name)}</a>
      ${meta ? `<span class="modal-row-meta">${meta}</span>` : ''}
    </li>`;
  };
  const subtitle = `${records.length} record${records.length === 1 ? '' : 's'} - click a name to open the contact in HubSpot`;
  showModal(title, subtitle, records.map(itemHtml).join(''));
}
/* Presentations / Calls-Meetings / New Intermediaries modal - each row
   hyperlinks the company name and the contact name (first + last)
   separately, straight to their own HubSpot records. A record with no
   resolved company (not every meeting/deal has one) shows plain text
   instead of a dead link. */
function openCompanyContactModal(records, title) {
  const itemHtml = r => {
    const companyHtml = r.company
      ? `<a href="${D.meta.company_url_base}${r.company.id}" target="_blank" rel="noopener">${escapeHtml(r.company.name)}</a>`
      : `<span class="modal-item-missing">No company on record</span>`;
    const contactHtml = `<a href="${D.meta.contact_url_base}${r.contact.id}" target="_blank" rel="noopener">${escapeHtml(r.contact.name)}</a>`;
    return `<li class="modal-row">${companyHtml}<span class="modal-row-sep" aria-hidden="true">·</span>${contactHtml}</li>`;
  };
  const subtitle = `${records.length} record${records.length === 1 ? '' : 's'} - click a company or contact to open it in HubSpot`;
  showModal(title, subtitle, records.map(itemHtml).join(''));
}
function closeRecordModal() {
  document.getElementById('dealModalBackdrop').hidden = true;
  document.removeEventListener('keydown', onModalKeydown);
  if (lastFocusedEl) lastFocusedEl.focus();
}
function onModalKeydown(e) {
  if (e.key === 'Escape') { closeRecordModal(); return; }
  if (e.key !== 'Tab') return;
  // Basic focus trap: wrap Tab/Shift+Tab within the modal's own
  // focusable elements (the link list + Close - recomputed every time,
  // since the list changes on each open).
  const focusable = Array.from(document.querySelectorAll('#dealModal a, #dealModal button'));
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function initModal() {
  document.getElementById('dealModalClose').addEventListener('click', closeRecordModal);
  document.getElementById('dealModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'dealModalBackdrop') closeRecordModal();
  });
}

/* ────────── period / director controls ────────── */
function syncUrl() {
  const url = new URL(window.location.href);
  url.searchParams.set('period', S.period);
  if (S.director) url.searchParams.set('director', S.director);
  else url.searchParams.delete('director');
  history.replaceState(null, '', url);
}
function buildPeriodSelect() {
  const sels = Array.from(document.querySelectorAll('.period-select'));
  const opts = [['ytd', `Year to date (${YEAR})`]];
  for (let m = 1; m <= CURRENT_MONTH; m++) opts.push([`m-${String(m).padStart(2, '0')}`, `${MONTH_NAMES[m - 1]} ${YEAR}`]);
  const optionsHtml = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  sels.forEach(sel => {
    sel.innerHTML = optionsHtml;
    sel.value = S.period;
    sel.addEventListener('change', () => {
      S.period = sel.value;
      sels.forEach(other => { if (other !== sel) other.value = S.period; });
      syncUrl();
      render();
    });
  });
}
function buildDirectorSelect() {
  const sel = document.getElementById('selDirector');
  const opts = [['', 'All Directors'], ...OWNER_ORDER.map(id => [id, OWNER_NAME[id]])];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`).join('');
  sel.value = S.director || '';
  sel.addEventListener('change', () => {
    S.director = sel.value || null;
    syncUrl();
    render();
  });
}

/* ────────── per-stage ranked boxes ────────── */
/* Target-to-date denominator: the flat annual per-BDM target, unprorated -
   multiplied by how many Directors are in scope for the combined Total row
   (ownerId null) - 1 when the Director filter narrows to one, 2 for "All".
   Paired with the existing cumulative-to-date numerator
   (cumulativeThroughPeriod()), so the percentage reflects progress made so
   far against the full year's goal, not a shrunk goal for the elapsed
   months. */
function targetToDate(stageKey, ownerId) {
  return D.targets[stageKey].per_bdm_annual * (ownerId ? 1 : activeOwners().length);
}
/* "This month" secondary line's denominator - one twelfth of the annual
   target, scaled the same way as targetToDate(). Only shown when a single
   month (not YTD) is selected. */
function monthlyTarget(stageKey, ownerId) {
  return Math.round(D.targets[stageKey].per_bdm_annual * (ownerId ? 1 : activeOwners().length) / 12);
}
/* Rank the active Director(s) by a stage's quantity for the selected
   period, higher first; ties keep OWNER_ORDER's existing order (João
   before Rohan). With the Director filter active this naturally returns
   a single-element array (that Director, rank 1). */
function rankedOwners(stageKey) {
  return activeOwners()
    .map((id, idx) => ({ id, idx, sum: stageSum(stageKey, id) }))
    .sort((a, b) => b.sum - a.sum || a.idx - b.idx)
    .map(o => o.id);
}
function renderStageBox(key) {
  const stage = D.stages[key];
  const isMonth = S.period !== 'ytd';
  const month = isMonth ? +S.period.slice(2) : null;
  const showRank = !S.director; // ranking a list of one Director is noise
  const showTotal = !S.director; // would duplicate the single row's own numbers
  const headingId = `stageBoxHeading-${key}`;
  const bodyRow = (ownerId, rank) => {
    const qty = stageSum(key, ownerId);
    const cum = cumulativeThroughPeriod(key, ownerId);
    const target = targetToDate(key, ownerId);
    const qtyCell = clickableCell(key, qty, ownerId);
    const nameCell = rank
      ? `${showRank ? `<span class="rank-badge">${rank}</span>` : ''}${escapeHtml(OWNER_NAME[ownerId])}`
      : '<b>Total</b>';
    let monthCell = '';
    if (isMonth) {
      const monthQty = stageMonthTotal(key, month, ownerId);
      const mTarget = monthlyTarget(key, ownerId);
      const cell = `This month: ${fmt(monthQty)}/${mTarget} (${pct(monthQty, mTarget)}%)`;
      monthCell = `<td><div class="kpi-sub">${cell}</div></td>`;
    }
    return `<tr>
      <td>${nameCell}</td>
      <td>${rank ? qtyCell : `<b>${qtyCell}</b>`}</td>
      <td>${rank ? '' : '<b>'}${fmt(cum)}/${target} (${pct(cum, target)}%)${rank ? '' : '</b>'}</td>
      ${monthCell}
    </tr>`;
  };
  const ranked = rankedOwners(key);
  return `<section class="sec card" style="--stage-color:${STAGE_COLOR_BY_KEY[key]}">
    <div class="card-head">
      <div>
        <h3 id="${headingId}">${escapeHtml(stage.label)}</h3>
        <p class="text-caption">Click a quantity to open the underlying records in HubSpot.</p>
      </div>
    </div>
    <div class="tbl-scroll"><table class="data" aria-labelledby="${headingId}">
      <thead><tr>
        <th scope="col" style="text-align:left">Director</th>
        <th scope="col">Quantity</th>
        <th scope="col">Target to date</th>
        ${isMonth ? '<th scope="col">This month</th>' : ''}
      </tr></thead>
      <tbody>${ranked.map((id, i) => bodyRow(id, i + 1)).join('')}</tbody>
      <tfoot>${showTotal ? bodyRow(null, null) : ''}</tfoot>
    </table></div>
  </section>`;
}
function renderStageBoxes() {
  const el = document.getElementById('stageBoxes');
  el.innerHTML = BOX_ORDER.map(renderStageBox).join('');
  el.querySelectorAll('.num-link').forEach(bindNumLink);
}
function bindNumLink(btn) {
  btn.addEventListener('click', () => onNumLinkClick(btn));
}

/* ────────── header / footer text ────────── */
function renderChrome() {
  document.getElementById('badgeDate').textContent = THROUGH;
  document.getElementById('footMeta').innerHTML = `Data&nbsp;through <strong>${THROUGH}</strong>`;
  document.getElementById('headSub').textContent =
    'Retained, Referred, New Intermediaries, Presentations, Calls/Meetings, split by Director.';
}

/* ────────── build ────────── */
function render() {
  renderChrome();
  renderStageBoxes();
}

buildPeriodSelect();
buildDirectorSelect();
initModal();
syncUrl();
render();
</script>
</body>
</html>
