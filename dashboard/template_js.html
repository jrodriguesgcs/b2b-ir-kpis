<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const D = __DATA__;

/* ────────── constants ────────── */
const STAGE_ORDER = D.stage_order;
const STAGE_COLOR_BY_KEY = {
  retained_clients: '#000957', referred_clients: '#3F8CFF', presentations: '#667085',
  calls_meetings: '#9DBEFA', new_intermediaries: '#C7CCD4',
};
const OWNER_ORDER = D.owner_order;
const OWNER_COLOR = {[OWNER_ORDER[0]]: '#000957', [OWNER_ORDER[1]]: '#3F8CFF'};
const OWNER_NAME = D.owners;
const YEAR = D.meta.year;
const THROUGH = D.meta.through;
const CURRENT_MONTH = +THROUGH.slice(5, 7);
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const RETAINED_TARGET = D.targets.retained_clients.per_bdm_annual;
const CALLS_TARGET = D.targets.calls_meetings.per_bdm_annual;

/* ────────── state ────────── */
function initialPeriodFromUrl() {
  const p = new URLSearchParams(window.location.search).get('period');
  if (p === 'ytd') return 'ytd';
  if (p && /^m-(0[1-9]|1[0-2])$/.test(p) && +p.slice(2) <= CURRENT_MONTH) return p;
  return 'ytd';
}
const S = { period: initialPeriodFromUrl(), trendBdm: 'both' };
let lastFocusedEl = null;

/* ────────── data access ────────── */
const fmt = n => (n == null ? '—' : n.toLocaleString('en-US'));
const pct = (n, d) => (d ? Math.round((100 * n) / d) : 0);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function monthPrefix(m) { return `${YEAR}-${String(m).padStart(2, '0')}-`; }
function periodMatch(day) {
  return S.period === 'ytd' ? true : day.startsWith(monthPrefix(+S.period.slice(2)));
}
/* Sum a stage's daily counts for one owner (or both, if ownerId is null) over the current period. */
function stageSum(stageKey, ownerId) {
  const daily = D.stages[stageKey].daily;
  const ids = ownerId ? [ownerId] : OWNER_ORDER;
  let t = 0;
  for (const id of ids) {
    const days = daily[id] || {};
    for (const [day, v] of Object.entries(days)) if (periodMatch(day)) t += v;
  }
  return t;
}
/* Sum a stage for a specific month, for one owner or both (ownerId null) - regardless of S.period. */
function stageMonthTotal(stageKey, month, ownerId) {
  const daily = D.stages[stageKey].daily;
  const prefix = monthPrefix(month);
  const ids = ownerId ? [ownerId] : OWNER_ORDER;
  let t = 0;
  for (const id of ids) {
    const days = daily[id] || {};
    for (const [day, v] of Object.entries(days)) if (day.startsWith(prefix)) t += v;
  }
  return t;
}
/* Sum a stage over an explicit set of ISO day strings, for one owner or both. */
function stageDaysTotal(stageKey, days, ownerId) {
  const daily = D.stages[stageKey].daily;
  const ids = ownerId ? [ownerId] : OWNER_ORDER;
  const daySet = new Set(days);
  let t = 0;
  for (const id of ids) {
    const dayMap = daily[id] || {};
    for (const [day, v] of Object.entries(dayMap)) if (daySet.has(day)) t += v;
  }
  return t;
}
function daysInMonth(month) { return new Date(YEAR, month, 0).getDate(); }
/* Partition a month's days into Monday-start weeks, clipped at the month
   boundary (same partitioning philosophy as the Excel workbook's own
   calendar hierarchy) - used for the Trend chart's weekly view. */
function weeksOfMonth(month) {
  const total = daysInMonth(month);
  const weeks = []; let current = [];
  for (let d = 1; d <= total; d++) {
    const iso = `${YEAR}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    current.push(iso);
    const dow = new Date(YEAR, month - 1, d).getDay(); // 0 = Sunday
    if (dow === 0 || d === total) { weeks.push(current); current = []; }
  }
  return weeks.map((days, i) => ({ label: `W${i + 1}`, days }));
}

/* ────────── click-through-to-HubSpot (Retained -> deal, Referred -> contact) ────────── */
function recordsFor(stageKey, ownerId, program) {
  if (stageKey === 'retained_clients') {
    const deals = D.stages.retained_clients.deals || [];
    return { kind: 'deal', records: deals.filter(d => periodMatch(d.day) && (!ownerId || d.owner === ownerId) && (!program || d.program === program)) };
  }
  if (stageKey === 'referred_clients') {
    const contacts = D.stages.referred_clients.contacts || [];
    return { kind: 'contact', records: contacts.filter(c => periodMatch(c.day) && (!ownerId || c.owner === ownerId)) };
  }
  return { kind: null, records: [] };
}
/* A clickable cell for Retained/Referred - a real <button> when nonzero
   (opens the underlying record(s) in HubSpot), plain text otherwise. */
function clickableCell(stageKey, value, ownerId) {
  if (!value) return fmt(0);
  return `<button class="num-link" type="button" data-stage="${stageKey}" data-owner="${ownerId || ''}">${fmt(value)}</button>`;
}
function onNumLinkClick(btn) {
  const stageKey = btn.dataset.stage;
  const owner = btn.dataset.owner || null;
  const { kind, records } = recordsFor(stageKey, owner, null);
  if (!records.length) return;
  const urlBase = kind === 'deal' ? D.meta.deal_url_base : D.meta.contact_url_base;
  if (records.length === 1) {
    window.open(urlBase + records[0].id, '_blank', 'noopener');
    return;
  }
  const parts = [D.stages[stageKey].label];
  if (owner) parts.push(OWNER_NAME[owner]);
  openRecordModal(records, urlBase, parts.join(' · '));
}
function openRecordModal(records, urlBase, title) {
  document.getElementById('dealModalTitle').textContent = title;
  document.getElementById('dealModalSub').textContent = `${records.length} - click one to open it in HubSpot`;
  document.getElementById('dealModalList').innerHTML = records.map(r =>
    `<li><a href="${urlBase}${r.id}" target="_blank" rel="noopener">${escapeHtml(r.name)}${r.program ? ' · ' + escapeHtml(r.program) : ''}</a></li>`).join('');
  lastFocusedEl = document.activeElement;
  document.getElementById('dealModalBackdrop').hidden = false;
  document.getElementById('dealModalClose').focus();
  document.addEventListener('keydown', onModalKeydown);
}
function closeRecordModal() {
  document.getElementById('dealModalBackdrop').hidden = true;
  document.removeEventListener('keydown', onModalKeydown);
  if (lastFocusedEl) lastFocusedEl.focus();
}
function onModalKeydown(e) { if (e.key === 'Escape') closeRecordModal(); }
function initModal() {
  document.getElementById('dealModalClose').addEventListener('click', closeRecordModal);
  document.getElementById('dealModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'dealModalBackdrop') closeRecordModal();
  });
}

/* ────────── period control ────────── */
function syncUrl() {
  const url = new URL(window.location.href);
  url.searchParams.set('period', S.period);
  history.replaceState(null, '', url);
}
function buildPeriodSelect() {
  const sel = document.getElementById('selPeriod');
  const opts = [['ytd', `Year to date (${YEAR})`]];
  for (let m = 1; m <= CURRENT_MONTH; m++) opts.push([`m-${String(m).padStart(2, '0')}`, `${MONTH_NAMES[m - 1]} ${YEAR}`]);
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  sel.value = S.period;
  sel.addEventListener('change', () => { S.period = sel.value; syncUrl(); render(); });
}
function buildTrendBdmToggle() {
  const seg = document.getElementById('trendBdmSeg');
  const opts = [['both', 'Both'], [OWNER_ORDER[0], OWNER_NAME[OWNER_ORDER[0]]], [OWNER_ORDER[1], OWNER_NAME[OWNER_ORDER[1]]]];
  seg.innerHTML = opts.map(([v, l]) =>
    `<button type="button" data-bdm="${v}" aria-pressed="${v === S.trendBdm}">${l}</button>`).join('');
  seg.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      S.trendBdm = btn.dataset.bdm;
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      renderTrend();
    });
  });
}

/* ────────── KPI cards ────────── */
function renderKpis() {
  const el = document.getElementById('kpis');
  el.innerHTML = STAGE_ORDER.map(key => {
    const stage = D.stages[key];
    const total = stageSum(key, null);
    const joao = stageSum(key, OWNER_ORDER[0]);
    const rohan = stageSum(key, OWNER_ORDER[1]);
    const clickable = key === 'retained_clients' || key === 'referred_clients';
    const joaoText = clickable ? clickableCell(key, joao, OWNER_ORDER[0]) : fmt(joao);
    const rohanText = clickable ? clickableCell(key, rohan, OWNER_ORDER[1]) : fmt(rohan);
    let targetNote = '';
    if (key === 'retained_clients') {
      targetNote = `<div class="kpi-sub">Target ${RETAINED_TARGET}/BDM/year</div>`;
    } else if (key === 'calls_meetings') {
      targetNote = `<div class="kpi-sub">${fmt(joao)}/${CALLS_TARGET} (${pct(joao, CALLS_TARGET)}%)&nbsp;João · ${fmt(rohan)}/${CALLS_TARGET} (${pct(rohan, CALLS_TARGET)}%)&nbsp;Rohan</div>`;
    }
    return `<div class="card kpi" style="--stage-color:${STAGE_COLOR_BY_KEY[key]}">
      <div class="text-overline">${stage.label}</div>
      <div class="kpi-row"><span class="kpi-val">${fmt(total)}</span></div>
      <div class="kpi-sub">João ${joaoText} · Rohan ${rohanText}</div>
      ${targetNote}
    </div>`;
  }).join('');
  el.querySelectorAll('.num-link').forEach(bindNumLink);
}

/* ────────── stage-by-BDM bars ────────── */
function renderStageBars() {
  document.getElementById('sbKey').innerHTML = OWNER_ORDER.map(id =>
    `<span class="sb-key-item"><i style="background:${OWNER_COLOR[id]}"></i>${OWNER_NAME[id]}</span>`).join('');
  const totals = STAGE_ORDER.map(key => stageSum(key, null));
  const max = Math.max(1, ...totals);
  const el = document.getElementById('stageBars');
  el.innerHTML = STAGE_ORDER.map(key => {
    const stage = D.stages[key];
    const joao = stageSum(key, OWNER_ORDER[0]);
    const rohan = stageSum(key, OWNER_ORDER[1]);
    const total = joao + rohan;
    const widthPct = Math.max(4, (100 * total) / max);
    const joaoShare = total ? (100 * joao) / total : 0;
    const rohanShare = total ? (100 * rohan) / total : 0;
    const clickable = key === 'retained_clients' || key === 'referred_clients';
    const joaoLabel = clickable ? clickableCell(key, joao, OWNER_ORDER[0]) : fmt(joao);
    const rohanLabel = clickable ? clickableCell(key, rohan, OWNER_ORDER[1]) : fmt(rohan);
    return `<div class="sb-row">
      <div class="sb-label">${stage.label}</div>
      <div class="sb-track" style="width:${widthPct}%">
        ${joao ? `<div class="sb-seg" style="width:${joaoShare}%;background:${OWNER_COLOR[OWNER_ORDER[0]]}"><span>${joaoLabel}</span></div>` : ''}
        ${rohan ? `<div class="sb-seg" style="width:${rohanShare}%;background:${OWNER_COLOR[OWNER_ORDER[1]]}"><span>${rohanLabel}</span></div>` : ''}
      </div>
      <div class="sb-total"><b>${fmt(total)}</b> total</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.num-link').forEach(bindNumLink);
}

/* ────────── table: BDM rows x Stage columns ────────── */
function renderBdmRow(ownerId, isGrandTotal) {
  const retained = stageSum('retained_clients', ownerId);
  const referred = stageSum('referred_clients', ownerId);
  const presentations = stageSum('presentations', ownerId);
  const calls = stageSum('calls_meetings', ownerId);
  const newInter = stageSum('new_intermediaries', ownerId);
  const total = retained + referred + presentations + calls + newInter;
  const retainedTarget = isGrandTotal ? `${CURRENT_MONTH}/${RETAINED_TARGET * 2}` : `${CURRENT_MONTH}/${RETAINED_TARGET}`;
  const callsTargetDenom = isGrandTotal ? CALLS_TARGET * 2 : CALLS_TARGET;
  const label = isGrandTotal ? 'Grand Total' : OWNER_NAME[ownerId];
  const cell = v => isGrandTotal ? `<b>${v}</b>` : v;
  return `<tr>
    <td>${label}</td>
    <td>${cell(clickableCell('retained_clients', retained, ownerId))}</td>
    <td>${cell(retainedTarget)}</td>
    <td>${cell(clickableCell('referred_clients', referred, ownerId))}</td>
    <td>${cell(fmt(presentations))}</td>
    <td>${cell(fmt(calls))}</td>
    <td>${cell(`${fmt(calls)}/${callsTargetDenom} (${pct(calls, callsTargetDenom)}%)`)}</td>
    <td>${cell(fmt(newInter))}</td>
    <td><b>${fmt(total)}</b></td>
  </tr>`;
}
function renderTable() {
  const tbody = document.querySelector('#stageTable tbody');
  const tfoot = document.querySelector('#stageTable tfoot');
  tbody.innerHTML = OWNER_ORDER.map(id => renderBdmRow(id, false)).join('');
  tfoot.innerHTML = renderBdmRow(null, true);
  document.querySelectorAll('#stageTable .num-link').forEach(bindNumLink);
}
function bindNumLink(btn) {
  btn.addEventListener('click', () => onNumLinkClick(btn));
}

/* ────────── trend chart ────────── */
let trendChart = null;
function trendOwner() { return S.trendBdm === 'both' ? null : S.trendBdm; }
function renderTrend() {
  const isMonth = S.period !== 'ytd';
  let labels, datasets;
  if (isMonth) {
    const month = +S.period.slice(2);
    const weeks = weeksOfMonth(month);
    labels = weeks.map(w => w.label);
    datasets = STAGE_ORDER.map(key => ({
      label: D.stages[key].label,
      data: weeks.map(w => stageDaysTotal(key, w.days, trendOwner())),
      borderColor: STAGE_COLOR_BY_KEY[key], backgroundColor: STAGE_COLOR_BY_KEY[key],
      tension: .3, pointRadius: 3, borderWidth: 2, fill: false,
    }));
    document.getElementById('trendSub').textContent = `Weekly totals for ${MONTH_NAMES[month - 1]} ${YEAR}, one line per stage.`;
  } else {
    const months = Array.from({ length: CURRENT_MONTH }, (_, i) => i + 1);
    labels = months.map(m => MONTH_NAMES[m - 1]);
    datasets = STAGE_ORDER.map(key => ({
      label: D.stages[key].label,
      data: months.map(m => stageMonthTotal(key, m, trendOwner())),
      borderColor: STAGE_COLOR_BY_KEY[key], backgroundColor: STAGE_COLOR_BY_KEY[key],
      tension: .3, pointRadius: 3, borderWidth: 2, fill: false,
    }));
    document.getElementById('trendSub').textContent = 'Monthly totals across the year, one line per stage.';
  }
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: REDUCED_MOTION ? false : undefined,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
    },
  });
  document.getElementById('trendLegend').innerHTML = STAGE_ORDER.map((key, i) =>
    `<button aria-pressed="true" data-i="${i}"><span class="key" style="background:${STAGE_COLOR_BY_KEY[key]}"></span>${D.stages[key].label}</button>`).join('');
  document.querySelectorAll('#trendLegend button').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i;
      const meta = trendChart.getDatasetMeta(i);
      meta.hidden = meta.hidden === null ? !trendChart.data.datasets[i].hidden : !meta.hidden;
      btn.setAttribute('aria-pressed', String(!meta.hidden));
      trendChart.update();
    });
  });
}

/* ────────── header / footer text ────────── */
function renderChrome() {
  document.getElementById('badgeDate').textContent = THROUGH;
  document.getElementById('footMeta').innerHTML = `Data&nbsp;through <strong>${THROUGH}</strong>`;
  const sel = document.getElementById('selPeriod');
  const label = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '—';
  document.getElementById('periodBig').textContent = label;
  document.getElementById('periodMeta').textContent =
    S.period === 'ytd' ? `1 Jan – ${THROUGH}` : `Calendar month · ${YEAR}`;
  document.getElementById('headSub').textContent =
    'Retained, Referred, Presentations, Calls/Meetings and New Intermediaries, split by BDM.';
  document.getElementById('funnelSub').textContent =
    S.period === 'ytd' ? `Year-to-date totals through ${THROUGH}` : 'Selected month';
}

/* ────────── build ────────── */
function render() {
  renderChrome();
  renderKpis();
  renderStageBars();
  renderTable();
  renderTrend();
}

buildPeriodSelect();
buildTrendBdmToggle();
initModal();
syncUrl();
render();
</script>
</body>
</html>
