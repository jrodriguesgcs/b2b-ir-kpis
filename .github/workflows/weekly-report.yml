name: Weekly B2B IR KPI Report

on:
  schedule:
    # 07:00 UTC every Monday. GitHub Actions cron is UTC-only and does not
    # shift for DST, so this is an approximation of 08:00 Europe/Lisbon:
    # it lands on 08:00 Lisbon during WEST/DST (roughly late Mar-late Oct)
    # and 07:00 Lisbon the rest of the year.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Who receives the emailed report. Not a secret - safe to edit directly.
  REPORT_RECIPIENT: jrodrigues@globalcitizensolutions.com

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          # No LibreOffice install step here on purpose: ubuntu-latest
          # doesn't ship Calc by default, and installing it would add real
          # minutes to every run. generate_report.py already falls back to
          # injecting cached formula values directly when LibreOffice isn't
          # available, producing an equally correct file.
          python generate_report.py

      - name: Commit regenerated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/reports.xlsx
          git diff --staged --quiet || git commit -m "Update weekly B2B IR KPI report [skip ci]"
          git push

      - name: Email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ env.REPORT_RECIPIENT }}
          subject: "Weekly B2B IR KPI Report - ${{ github.run_id }}"
          body: |
            Attached is this week's B2B Intermediary-Referral KPI report.

            Generated by the "${{ github.workflow }}" GitHub Actions workflow.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: reports/reports.xlsx

      - name: Email failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ env.REPORT_RECIPIENT }}
          subject: "FAILED: Weekly B2B IR KPI Report"
          body: |
            The weekly B2B IR KPI report run failed. No report was generated
            or sent this week.

            Check the Actions log for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
